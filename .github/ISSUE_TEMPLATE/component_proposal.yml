name: Usulan komponen / Component proposal
description: Kebutuhan yang belum tercakup komponen yang ada. / A need no existing component covers.
labels: [proposal]
body:
  - type: textarea
    id: need
    attributes:
      label: Kebutuhan / The need
      description: Layanan atau layar apa yang membutuhkannya? / Which service or screen needs it?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Komponen yang sudah dicoba / Components you tried
      description: Lihat daftar komponen dulu; kekurangan kecil biasanya cukup jadi varian. / Check the component list first; a near miss is usually a variant.
  - type: checkboxes
    id: checks
    attributes:
      label: Periksa / Checks
      options:
        - label: Saya sudah mencari di dokumentasi. / I searched the docs.
          required: true
