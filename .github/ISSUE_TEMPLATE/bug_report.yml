name: Laporan bug / Bug report
description: Sesuatu tidak bekerja seperti seharusnya. / Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi? / What happened?
      description: Langkah untuk mengulang, hasil yang diharapkan, dan hasil yang terjadi. / Steps to reproduce, expected and actual result.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Bagian / Area
      options: [CSS, JavaScript (lds.js), React, CLI (lampung-ds), Flutter, Aksara Lampung, Dokumentasi / Docs, Contoh / Examples, Lainnya / Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi / Version
      placeholder: 0.1.0
  - type: input
    id: env
    attributes:
      label: Peramban, OS, framework / Browser, OS, framework
      placeholder: Chrome 131, Android 15, Next.js 16
