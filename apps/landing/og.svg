<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Lampung Design System</title>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <!-- Brand mark, the favicon at 3x -->
  <g transform="translate(88 88) scale(3)">
    <rect width="32" height="32" rx="8" fill="#0B6E4F"/>
    <path d="M7 19.5 8.6 13.2 10.6 17.4 12.4 11.4 14.3 16.6 16 8.5 17.7 16.6 19.6 11.4 21.4 17.4 23.4 13.2 25 19.5Z" fill="#FFFFFF"/>
    <rect x="7" y="21" width="18" height="2.6" rx="1.3" fill="#C9952B"/>
  </g>
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0A0F0D">
    <text x="88" y="318" font-size="72" font-weight="600" letter-spacing="-2.4">Lampung Design System</text>
    <text x="88" y="384" font-size="32" font-weight="400" fill="#56615C" letter-spacing="-0.3">Sistem desain terbuka untuk situs dan aplikasi layanan publik.</text>
    <text x="88" y="542" font-size="26" font-weight="500" fill="#0A6246">lampung.kartadinata.app</text>
    <text x="1112" y="542" font-size="22" font-weight="400" fill="#56615C" text-anchor="end">Proyek komunitas, bukan situs resmi pemerintah</text>
  </g>
  <!-- Siger gold rule: identity ornament, not text -->
  <rect x="88" y="452" width="168" height="6" rx="3" fill="#C9952B"/>
  <!-- Hijau Lampung band on the right edge -->
  <rect x="1152" y="0" width="48" height="630" fill="#0B6E4F"/>
</svg>
