name: Release

# Push a tag like v0.1.0 after updating the version in package.json, packages/cli/package.json,
# packages/flutter/pubspec.yaml and CHANGELOG.md (one commit: "chore(release): 0.1.0").
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$TAG"
          grep -q "^version: $TAG$" packages/flutter/pubspec.yaml
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public -w lampung-ds
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pub:
    name: Publish to pub.dev
    needs: npm
    # pub.dev automated publishing: enable it for this repository and the tag pattern v{{version}}
    # in the package admin page, then this job authenticates with GitHub OIDC (no secret needed).
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
      # pub.dev only accepts uploads from this GitHub Actions environment (package admin settings).
      environment: pub.dev

  github:
    name: GitHub release
    needs: [npm, pub]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the changelog
        run: awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
