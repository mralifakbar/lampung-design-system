name: Release

# Push a tag like v0.1.0 after updating the version in package.json, packages/cli/package.json,
# packages/flutter/pubspec.yaml and CHANGELOG.md (one commit: "chore(release): 0.1.0").
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$TAG"
          grep -q "^version: $TAG$" packages/flutter/pubspec.yaml
      # npm trusted publishing (OIDC): no token; needs npm 11.5+ and each package's Trusted Publisher
      # set to this repository and release.yml on npmjs.com. Versions already on npm are skipped,
      # so re-running a tag (or tagging a version published by hand) does not fail.
      - run: npm install -g npm@latest
      - name: Publish lampung-design-system
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "lampung-design-system@$V" version >/dev/null 2>&1; then echo "lampung-design-system@$V is already on npm"; else npm publish --provenance --access public; fi
      - name: Publish lampung-ds
        run: |
          V="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "lampung-ds@$V" version >/dev/null 2>&1; then echo "lampung-ds@$V is already on npm"; else npm publish --provenance --access public -w lampung-ds; fi

  pub-check:
    name: Is this version on pub.dev?
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -sf "https://pub.dev/api/packages/lampung_design_system/versions/$V" >/dev/null; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi

  pub:
    name: Publish to pub.dev
    needs: [npm, pub-check]
    if: needs.pub-check.outputs.published != 'true'
    # pub.dev automated publishing: enable it for this repository and the tag pattern v{{version}}
    # in the package admin page, then this job authenticates with GitHub OIDC (no secret needed).
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
      # pub.dev only accepts uploads from this GitHub Actions environment (package admin settings).
      environment: pub.dev

  github:
    name: GitHub release
    needs: [npm, pub]
    # Runs when pub.dev was published now or skipped because the version was already there.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the changelog
        run: awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
