name: lampung_design_system
description: >-
  Lampung Design System (unofficial) for Flutter: tokens, a Material 3 theme,
  bundled fonts, Solar icon fonts and widgets for public service apps.
version: 0.1.0
homepage: https://lampung.kartadinata.app
repository: https://github.com/mralifakbar/lampung-design-system/tree/main/packages/flutter
issue_tracker: https://github.com/mralifakbar/lampung-design-system/issues
documentation: https://lampung.kartadinata.app
topics:
  - design-system
  - ui
  - theme
  - indonesia
  - government

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
    - family: LDS Icons
      fonts:
        - asset: fonts/lds-icons.ttf
    - family: LDS Icons Fill
      fonts:
        - asset: fonts/lds-icons-fill.ttf
